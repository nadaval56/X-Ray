name: Build & deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # כל בוקר: בנייה מחדש עם נתוני קרני X עדכניים מהשמש ("השמיים ברנטגן"), אחרי שהאתר "השמש היום" מתעדכן
  schedule:
    - cron: '40 7 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # נתוני השמש נמשכים כאן, בזמן הבנייה — הדפדפן של הגולש לא פונה לשום אתר אחר. כישלון לא עוצר את הבנייה.
      - if: github.event_name != 'pull_request'
        run: npm run sun
      # כולל validate + check-licenses — נכשל אם חסר שדה או שהרישיון לא מותר
      - run: npm run build
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
